

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productos-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Productos#2026"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productos-db-init

    depends_on:
      sqlserver:
        condition: service_healthy

    volumes:
      - ./Database:/scripts:ro

    command: >
      /opt/mssql-tools18/bin/sqlcmd
      -S sqlserver -U sa -P "Productos#2026" -C
      -i /scripts/script.sql

    restart: "no"


volumes:
  sqlserver-data:
